name: Claude Review

# 判断記録 0007: 実装したセッションとは別の文脈で PR を評価する。
# PR を開いたときに1回だけ動く。見直してほしいときは PR に「@claude review」とコメントする。
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            あなたは tabitabi の PR を、実装した人とは別の立場で評価するレビュー役です。
            評価の観点は .github/review-guide.md に書いてあります。最初に読んでください。
            AGENTS.md と docs/decisions/ があれば、前提として読んでください。

            指摘は日本語で書いてください。
            - 具体的な行に関する指摘は、インラインコメントにする
            - 最後に、PR 全体へのまとめを1件だけコメントする
            PR の承認・マージ・push はしないでください。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
